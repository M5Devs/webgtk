# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Build the WebGTK Chromium V3 Engine (Potato Edition) & Publish Artifact.
# Slashes 38% of the build graph down to ~17.4k objects.

name: build-engine

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (leave empty for default GitHub runner)"
        type: string
        default: ""
      publish:
        description: "Where to publish the artifact"
        type: choice
        options:
          - github-release
          - huggingface
          - both
          - none
        default: both
      hf_dataset:
        description: "Hugging Face dataset to publish to"
        type: string
        default: "M5-Dev/webgtk-chromium-diet"
  push:
    tags:
      - "engine-v*"

permissions:
  contents: write

concurrency:
  group: build-engine-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT: webgtk-engine-linux-x64.tar.gz

jobs:
  build:
    name: Build and publish the V3 engine
    runs-on: ${{ inputs.runner || vars.ENGINE_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 360  # 6 hours max on GitHub Free Runners

    steps:
      - name: Check out WebGTK
        uses: actions/checkout@v4

      # 1. تنظيف عميق وشامل للهارد لتوفير أكتر من 35 جيجا SSD فاضيين!
      - name: Maximize free disk space
        run: |
          echo "==> Cleaning unneeded SDKs and heavy toolchains..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -a --force 2>/dev/null || true
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h .

      - name: Report runner capacity
        run: |
          echo "cores:  $(nproc)"
          echo "memory: $(free -h | awk '/^Mem:/{print $2}')"
          echo "disk:   $(df -h . | awk 'NR==2{print $4}')"

      # 2. تسطيب كل مكاتب أوبونتو المطلوبة للبيلد المكمم والـ GPU والـ Mold
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-pip curl wget ca-certificates xz-utils \
            pkg-config xvfb mold clang lld rustc cargo binutils \
            libgtk-3-dev libgtk-4-dev libatk-bridge2.0-dev \
            libnss3-dev libnspr4-dev libxss-dev libasound2-dev libcups2-dev \
            libdrm-dev libgbm-dev libxkbcommon-dev libxcomposite-dev \
            libxdamage-dev libxrandr-dev libxtst-dev libpango1.0-dev \
            libcairo2-dev libepoxy-dev libgl1-mesa-dev libegl1-mesa-dev \
            mesa-common-dev libudev-dev libpci-dev libpulse-dev libcap-dev \
            libva-dev libvdpau-dev libxshmfence-dev libkrb5-dev libdbus-1-dev
          pip install -q huggingface_hub

      # 3. الكاش الذكي لتسريع أي رن مستقبلي
      - name: Cache engine toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            engine/gnroot
            engine/cipd
            engine/chromium/third_party/llvm-build
            engine/chromium/third_party/rust-toolchain
            engine/chromium/third_party/perfetto
          key: engine-v3-deps-${{ hashFiles('scripts/setup_engine.sh') }}

      # 4. تشغيل سكربت البيلد الرسمي لـ V3 الصافي
      - name: Build and package the engine
        run: |
          scripts/build_engine_artifact.sh \
            --dir "$GITHUB_WORKSPACE/engine" \
            --out "$GITHUB_WORKSPACE/$ARTIFACT" \
            --jobs "$(nproc)"

      - name: Inspect the artifact
        run: |
          set -euo pipefail
          test -f "$ARTIFACT"
          echo "Archive size:   $(du -h "$ARTIFACT" | cut -f1)"
          echo "SHA256:         $(sha256sum "$ARTIFACT" | cut -d' ' -f1)"
          tar -tzf "$ARTIFACT" | head -n 20

      # 5. اختبار حقيقي: ربط WebGTK بالموتور المتبني وتشغيل التيستات!
      - name: Link WebGTK against the artifact
        run: |
          set -euo pipefail
          rm -rf engine/prebuilt
          mkdir -p engine/prebuilt
          tar -xzf "$ARTIFACT" -C engine/prebuilt
          cmake -S . -B build-prebuilt \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBGTK_USE_PREBUILT_ENGINE=ON
          cmake --build build-prebuilt -j"$(nproc)"

      - name: Run the test suite against the prebuilt engine
        run: xvfb-run -a ctest --test-dir build-prebuilt --output-on-failure

      # 6. رفع الـ Artifact على صفحة الأكشنز
      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: webgtk-engine-linux-x64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 30

      # 7. النشر على GitHub Release
      - name: Publish to a GitHub Release
        if: (inputs.publish == 'github-release' || inputs.publish == 'both' || startsWith(github.ref, 'refs/tags/engine-v')) && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          generate_release_notes: true

      # 8. النشر على Hugging Face بمكتبة Python الرسمية والمضمونة
      - name: Publish to Hugging Face
        if: (inputs.publish == 'huggingface' || inputs.publish == 'both') && !cancelled()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c '
          import os, sys
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              print("::warning::Secret HF_TOKEN is not set; skipping Hugging Face upload.")
              sys.exit(0)
          dataset = "${{ inputs.hf_dataset }}"
          artifact = "${{ env.ARTIFACT }}"
          print(f"Uploading {artifact} to {dataset}...")
          api = HfApi(token=token)
          api.upload_file(
              path_or_fileobj=artifact,
              path_in_repo=artifact,
              repo_id=dataset,
              repo_type="dataset"
          )
          print("Successfully uploaded to Hugging Face!")
          '
